[package]
name = "sagebrush-agent-backup"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Encrypted backup of an Autonomous agent host: one JSON request on stdin, one JSON result on stdout (host backup design r3.3)"
publish = false

[dependencies]
# The repository library: sagemathinc's rustic_core fork, pinned by git rev (the qualified pin; its crates are
# Apache-2.0 OR MIT). Only rustic_core: the S3 backend is ours (src/s3.rs), so the HTTP client is ours too.
rustic_core = { git = "https://github.com/sagemathinc/rustic_core.git", rev = "51115c4755fea8d0a5254e409d99e47a293d68c5" }
# OpenDAL with exactly one service, S3, and the blocking API rustic_core's traits need.
opendal = { version = "0.59.5", default-features = false, features = ["blocking", "layers-retry", "services-s3"] }
opendal-http-transport-reqwest = "0.59.5"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }
tokio = { version = "1.49.0", default-features = false, features = ["rt-multi-thread"] }
bytes = "1.11.1"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
libc = "=0.2.191"

[features]
# Tests only: allows an `http` endpoint on a loopback address (the SeaweedFS test server). Never in a release build:
# without it, any endpoint that isn't https is refused.
test-loopback-http = []

[profile.release]
lto = true
codegen-units = 1
strip = true
